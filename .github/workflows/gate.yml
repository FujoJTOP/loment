# 静态门禁 —— 目前是**测量/诊断轮**，还没设成必需检查
#
# 已经跑通过一轮: 62 条 43 PASS / 19 FAIL，整轮 6m23s（artifact 里有原始日志）。
# **还没设必需检查的理由**: 19 条红里 15 条是"本机全绿、runner 上红"的 Linux
# 可移植性问题 —— 而环境自述已经排除"缺命令"（clang / llvm-objdump / rustc /
# qemu / java / node / vim / go 全在，只缺 nvim）。基线必须**实测**，否则接上
# 必需检查的第一天就是 19 条红的噪音。
#
# 三种用法:
#   1) 自动: PR 与 push 到 main → 跑整道静态门禁（62 条）→ 红项进 job summary、
#      原始日志进 artifact；
#   2) 手动给 `suite`（模块名，如 `loment_tools_test`）→ 只跑那一个套件、打**全量
#      输出**。为什么需要这条: `bash tools/ci.py:203` 每条只留**最后一行**，那不够
#      定位病因（第一轮的 artifact 就是这么被它限制住的）；
#   3) 手动给 `only`（逗号分隔的子串）→ 走 ci.py 只跑那几条，用来快速确认"修好了"。
#
# 三条边界（都来自仓库自己的纪律）:
#   * **不新增 tools/*.py** —— `loment_release.GLOBS` 是显式清单，新增一个工具文件
#     会让发布清单过期；所以汇总/比对逻辑写在 workflow 里，不落成脚本。
#   * **不碰 lom/**、**不改任何判据** —— 把门禁搬上 CI 不该顺手改判据。
#
# ## 它现在是**门**，判据是"不新增红"
#
# 全绿还不是现状（实测 10 条已知红），所以判据不是"全绿"而是**"不新增红"**：
# 基线（`.github/gate-baseline.txt`，**实测**出来的那份清单）上的红不判失败，
# **清单之外的**红判失败。这就是"必需检查"能挂上来而不变成噪音的原因。
#
# 两处细节:
#   * **新红先单跑一遍再判**：并行轮里的红有一部分只是撞上了别的套件在写同一棵树
#     （`CONTRIBUTING.md` 记过）。单跑还是红才算数 —— 误报的门会被人忽略。
#   * **基线只许变短**：哪一条修好了就在同一个 PR 里删掉它，否则 summary 会一直提醒。

name: gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: '单跑这些套件（模块名，逗号分隔，如 loment_grammar_test,loment_p7_test）。留空 = 跑整道门禁'
        required: false
        default: ''
      only:
        description: '走 ci.py 只跑名字含这些子串的几条（逗号分隔）。留空 = 全部'
        required: false
        default: ''
      diagnose_twin:
        description: '跑"孪生二进制段错误"的定向探针（写死的固定步骤，不是任意命令）。true = 跑'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  static:
    name: ci.py --static-only
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      # 装门禁要的外部命令。名单是实测出来的
      # （`grep -rho 'which("...")' tools/*.py`）: clang 45 处，还有
      # llvm-objdump/nm/ar、qemu-system-x86_64/qemu-aarch64、rustc、java、go、vim、node。
      # 第一轮的环境自述证明**命令清单**已经够（只缺不需要的 nvim）—— 但**版本**不够:
      # 见下面 LLVM 那一段。
      - name: 装工具链
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            qemu-system-x86 qemu-user \
            golang-go default-jdk \
            nodejs npm vim
          # 仓里发出的 IR 用 `#dbg_declare` —— 那是 **LLVM 19** 起的调试记录语法。
          # ubuntu-24.04 自带的 clang 是 **18**，于是在 `--debug` 那几条判据上报
          # `error: expected instruction opcode`（`loment_p7_test` 的符号化器、
          # `loment_tools_test` 的 m59 三条）。本机能过是因为本机 LLVM 是 22。
          # 版本下限写在 CONTRIBUTING「Getting a toolchain」。
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 19
          # 让不带版本号的名字指向 19（/usr/local/bin 在 PATH 里排在 /usr/bin 前面）。
          for t in clang clang++ lld ld.lld llvm-objdump llvm-nm llvm-ar; do
            if [ -x "/usr/lib/llvm-19/bin/$t" ]; then
              sudo ln -sf "/usr/lib/llvm-19/bin/$t" "/usr/local/bin/$t"
            fi
          done
          clang --version | head -1
          llvm-objdump --version | head -1

      # 先自述环境 —— 这样"红"才有归因: 是仓库的问题，还是这个 runner 上没有那个命令。
      - name: 环境自述
        run: |
          echo "runner: $(uname -a)"
          echo "python: $(python3 -V)"
          echo "cpu: $(nproc)"
          echo "clang: $(clang --version | head -1)"
          echo "llvm-objdump: $(llvm-objdump --version | head -1)"
          for t in clang clang++ lld ld.lld llvm-objdump llvm-nm llvm-ar rustc cargo \
                   qemu-system-x86_64 qemu-aarch64 go java javac node npm vim nvim \
                   python3 git sh; do
            printf '%-20s %s\n' "$t" "$(command -v "$t" || echo '—— 缺')"
          done

      # 用法 2: 单跑套件（可一次给多个，逗号分隔）—— 定位病因用。
      # 每条打三样: 退出码与行数、失败/异常行（**不靠尾部** —— 失败可能在中段，而套件
      # 后面还会继续打很多行）、尾 60 行。`ci.py` 每条只留最后一行，那样定位不了。
      - name: 单跑套件
        if: ${{ github.event.inputs.suite != '' }}
        run: |
          set +e
          IFS=',' read -ra parts <<< "${{ github.event.inputs.suite }}"
          for raw in "${parts[@]}"; do
            s="${raw//[[:space:]]/}"
            [ -z "$s" ] && continue
            echo "=================== tools/$s.py ==================="
            out="$(mktemp)"
            python3 "tools/$s.py" > "$out" 2>&1
            echo "rc=$?  输出行数=$(wc -l < "$out")"
            echo "--- 失败/异常行 ---"
            grep -nE 'FAIL|Error|error|Traceback|Assertion|assert' "$out" | head -40
            echo "--- 尾 60 行 ---"
            tail -60 "$out"
            rm -f "$out"
          done

      # 用法 4: 定向探针 —— 三条套件里的自举孪生二进制在 runner 上段错误（rc=-11），
      # 而本机（WSL，也是 Linux）全绿。这类事猜不出来，只能在 runner 上直接看。
      # **写死的固定步骤**，不做"任意命令"输入（这是公开仓）。
      - name: 探针 —— 孪生二进制的段错误
        if: ${{ github.event.inputs.diagnose_twin == 'true' }}
        run: |
          set +e
          echo "### 地址布局 / 内核"
          echo "（上一轮已排除的两类：关 ASLR 与放大栈都没有改变结果）"
          echo "randomize_va_space: $(cat /proc/sys/kernel/randomize_va_space)"
          uname -a
          echo "cpu: $(nproc)"
          echo
          echo "### 控制组：直接跑（预期红 —— 孪生 rc=-11）"
          timeout 600 python3 tools/potato_test.py 2>&1 | tail -8
          echo
          echo "### 段错误地址（dmesg 那一行还带着出错指令的 ip）"
          sudo dmesg 2>/dev/null | grep -iE "segfault|trap" | tail -4 \
            || echo "（dmesg 拿不到：kernel.dmesg_restrict）"
          echo
          echo "### gdb 跟着子进程抓现场：出错指令 + 周围的指令 + 寄存器里的坏地址"
          echo "### （固定 ip 说明同一个代码点拿到坏参数；rdi/rsi 就是那个参数）"
          sudo apt-get install -y -qq gdb
          timeout 900 gdb -batch -q \
            -ex "set follow-fork-mode child" \
            -ex "set detach-on-fork off" \
            -ex "set confirm off" \
            -ex run \
            -ex "info registers rip rax rbx rcx rdx rsi rdi rbp rsp" \
            -ex "x/10i \$rip-16" \
            -ex "bt" \
            --args python3 tools/potato_test.py 2>&1 | tail -70

      # 用法 1/3: 跑整道门禁（或只跑几条）。红项留给下一步汇总，不让它把 job 弄挂。
      - name: 跑静态门禁
        if: ${{ github.event.inputs.suite == '' && github.event.inputs.diagnose_twin != 'true' }}
        run: |
          if [ -n "${{ github.event.inputs.only }}" ]; then
            args=""
            IFS=',' read -ra parts <<< "${{ github.event.inputs.only }}"
            for p in "${parts[@]}"; do args="$args --only-static $p"; done
            python3 tools/ci.py --static-only $args > gate.out 2>&1 || true
          else
            python3 tools/ci.py --static-only > gate.out 2>&1 || true
          fi
          echo "--- 尾 40 行 ---"
          tail -40 gate.out

      - name: 汇总
        if: ${{ always() && github.event.inputs.suite == '' && github.event.inputs.diagnose_twin != 'true' }}
        run: |
          pass=$(grep -c ':: \[static\].*PASS' gate.out || true)
          fail=$(grep -c ':: \[static\].*FAIL' gate.out || true)
          echo "绿 $pass / 红 $fail / 共 $((pass + fail))"
          {
            echo "## 静态门禁 —— 测量"
            echo ""
            echo "绿 **$pass** · 红 **$fail** · 共 **$((pass + fail))**（工具链自述见日志）"
            echo ""
            echo "### 红项"
            echo '```'
            grep ':: \[static\].*FAIL' gate.out || echo "（无）"
            echo '```'
            echo ""
            echo "### 最慢的 8 条"
            echo '```'
            grep ':: \[static\]' gate.out | sort -k3 -rn | head -8
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 真门那一半：对照基线，**只对新红报红**。
      - name: 对照基线（只对新红报红）
        if: ${{ always() && github.event.inputs.suite == '' && github.event.inputs.diagnose_twin != 'true' }}
        run: |
          set +e
          if [ ! -f .github/gate-baseline.txt ]; then
            echo "::error::基线文件 .github/gate-baseline.txt 不见了 —— 门禁不猜，直接判失败"
            exit 1
          fi
          grep -E ':: \[static\].*FAIL' gate.out | awk '{print $3}' | sort -u > red.txt
          grep -v '^[[:space:]]*#' .github/gate-baseline.txt | awk 'NF {print $1}' | sort -u > base.txt
          comm -13 base.txt red.txt > new_red.txt
          comm -23 base.txt red.txt > gone.txt
          : > confirmed.txt
          : > flaked.txt
          while read -r name; do
            [ -z "$name" ] && continue
            echo "=== 新红复跑（单跑）: $name ==="
            python3 tools/ci.py --static-only --only-static "$name" > "re_$name.log" 2>&1
            rc=$?
            tail -4 "re_$name.log"
            if [ $rc -eq 0 ]; then
              echo "  -> 单跑**绿**：判为并行假红（不计入判据）"
              echo "$name" >> flaked.txt
            else
              echo "  -> 单跑**仍红**：这是这一笔引入的新红"
              echo "$name" >> confirmed.txt
            fi
          done < new_red.txt
          n_red=$(wc -l < red.txt | tr -d ' ')
          n_base=$(wc -l < base.txt | tr -d ' ')
          n_bad=$(wc -l < confirmed.txt | tr -d ' ')
          n_flake=$(wc -l < flaked.txt | tr -d ' ')
          n_gone=$(wc -l < gone.txt | tr -d ' ')
          {
            echo "## 对照基线（判据：不新增红）"
            echo ""
            echo "本轮红 **$n_red** · 基线 **$n_base** · 新红 **$n_bad** · 并行假红 $n_flake · 基线已过期 $n_gone"
            echo ""
            if [ "$n_bad" -gt 0 ]; then
              echo "### 新红（这一笔引入的）"
              echo '```'
              cat confirmed.txt
              echo '```'
            fi
            if [ "$n_flake" -gt 0 ]; then
              echo "### 并行假红（单跑绿 —— **不**判失败）"
              echo '```'
              cat flaked.txt
              echo '```'
            fi
            if [ "$n_gone" -gt 0 ]; then
              echo "### 基线该变短了"
              echo '这几条已经绿了，请在**同一个 PR 里**从 `.github/gate-baseline.txt` 删掉：'
              echo '```'
              cat gone.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$n_bad" -gt 0 ]; then
            echo "::error::门禁：新红 $n_bad 条 —— $(paste -sd ' ' confirmed.txt)"
            exit 1
          fi
          echo "门禁：没有新红（基线里 $n_gone 条已过期，见 job summary）"

      - uses: actions/upload-artifact@v4
        if: ${{ always() && github.event.inputs.suite == '' && github.event.inputs.diagnose_twin != 'true' }}
        with:
          name: gate-log
          path: |
            gate.out
            red.txt
            base.txt
            new_red.txt
            confirmed.txt
            flaked.txt
            gone.txt
            re_*.log
          if-no-files-found: warn
