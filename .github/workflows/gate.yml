# 静态门禁 —— 第一步：测量（这一版**还不是门**）
#
# 为什么先测量: 绿集必须在 GitHub 的 runner 上**实测**出来。本机那几类固有红里，
# 一部分是 Windows/WSL 与"姊妹仓 LinuxFUAI/ 不在树里"造成的 —— 到了 ubuntu runner
# 上，哪些消失、哪些换成别的原因，只有跑一次才知道。**猜一份基线写进必需检查，
# 等于把假信号变成门。**
#
# 所以这一版只做三件事:
#   1) 把 62 条全量跑一遍（`python tools/ci.py --static-only`），结果留档成 artifact；
#   2) 先打一份**环境自述**，让后面每一条红都能归因到"仓库的问题"还是"少了某个命令"；
#   3) 把红项名字写进 job summary。
#
# 下一步（绿集确定后）: 把结果变成**必需检查** + 与一份实测基线比对（只对"新红"报红）。
# 那时候自动合并才会真的"等它" —— 现在的状态是: 无 CI、无必需检查，所以开了自动合并
# 就是**立刻合**，没有东西可等。
#
# 三条设计约束（都来自仓库自己的纪律）:
#   * **不新增 tools/*.py** —— `loment_release.GLOBS` 是显式清单，新增一个工具文件
#     会让发布清单过期。所以比对/汇总逻辑写在 workflow 里，不落成脚本。
#   * **不碰 lom/**、不改任何判据 —— 这一步只观察。
#   * **故意不让红项把 job 弄挂**（`|| true`）—— 它还不是门；一个"第一天就全红"的
#     必需检查不是安全网，是噪音。

name: gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: ci.py --static-only
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      # 装门禁要的外部命令。名单是实测出来的
      # （`grep -rho 'which("...")' tools/*.py`）: clang 45 处，还有
      # llvm-objdump/nm/ar、qemu-system-x86_64/qemu-aarch64、rustc、java、go、vim、node。
      # 少哪一样，对应那几条就会红成"找不到命令" —— 那不是仓库的回归。
      - name: 装工具链
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            clang lld llvm \
            qemu-system-x86 qemu-user \
            golang-go default-jdk \
            nodejs npm vim
          # Ubuntu 上 llvm-* 常只有带版本号的名字，而门禁按不带版本号的名字找。
          for t in llvm-objdump llvm-nm llvm-ar; do
            if ! command -v "$t" >/dev/null 2>&1; then
              s="$(ls /usr/bin/$t-* 2>/dev/null | sort -V | tail -1 || true)"
              if [ -n "$s" ]; then sudo ln -sf "$s" "/usr/bin/$t"; fi
            fi
          done

      # 先自述环境 —— 这样"红"才有归因: 是仓库的问题，还是这个 runner 上没有那个命令。
      - name: 环境自述
        run: |
          echo "runner: $(uname -a)"
          echo "python: $(python3 -V)"
          echo "cpu: $(nproc)"
          for t in clang clang++ lld ld.lld llvm-objdump llvm-nm llvm-ar rustc cargo \
                   qemu-system-x86_64 qemu-aarch64 go java javac node npm vim nvim \
                   python3 git sh; do
            printf '%-20s %s\n' "$t" "$(command -v "$t" || echo '—— 缺')"
          done

      - name: 全量跑静态门禁
        run: |
          # `|| true`: 红项留给下一步汇总，这一版不让它把 job 弄挂（见文件头）。
          python3 tools/ci.py --static-only > gate.out 2>&1 || true
          echo "--- 尾 40 行 ---"
          tail -40 gate.out

      - name: 汇总
        if: always()
        run: |
          pass=$(grep -c ':: \[static\].*PASS' gate.out || true)
          fail=$(grep -c ':: \[static\].*FAIL' gate.out || true)
          echo "绿 $pass / 红 $fail / 共 $((pass + fail))"
          {
            echo "## 静态门禁（测量轮）"
            echo ""
            echo "绿 **$pass** · 红 **$fail** · 共 **$((pass + fail))**（工具链自述见日志）"
            echo ""
            echo "### 红项"
            echo '```'
            grep ':: \[static\].*FAIL' gate.out || echo "（无）"
            echo '```'
            echo ""
            echo "### 最慢的 8 条"
            echo '```'
            grep ':: \[static\]' gate.out | sort -k3 -rn | head -8
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-log
          path: gate.out
          if-no-files-found: warn
