# 发布 —— tag 推上来就出摊，不再需要任何人的开发机
#
# ## 它替代的那条手工路
#
# `v0.1.4` 的五个 asset 是**本机**出的：`python tools/loment_dist.py --emit` 之后手工
# `gh release create` 把 `loment/dist/` 里那几件传上去。这条路的问题不是麻烦，是
# **不可复现**：包里的 `share/loment/version` 记的是构建那一刻的 `git rev-parse HEAD`
# （`loment_dist.version_text`），所以"这一版到底从哪个 commit 出来的"只存在于当时那个
# 终端里。从 tag 出发之后，`version` 那一行可与 tag 对照。
#
# ## 为什么 runner 上不需要 clang / LLVM / WSL
#
# `loment_dist.py --emit` 的起点是**已提交的种子**：`build_stage1` 用纯 Python 的
# `_lomelf_link` 把 `loment/build/selfhost_driver.ll` 链成 stage1，再**直接执行**它
# （Linux 那支缺可执行位就 `PermissionError`，2026-09-22 那条已经修过）。
# 两个平台的包都由同一份 IR 各链一遍，所以自己就是 ELF 的 runner 上只要 Python。
# **这与 `gate.yml` 里那套 LLVM 19 的安装是两回事** —— 别把它抄过来。
#
# ## 硬判据：tag 必须等于仓里的版本号
#
# `VER` 的唯一真源是 `tools/loment_release.py` 的 `RELEASE`。tag 与它不一致时**直接不发布**：
# 否则会出一份文件名写着 0.1.5、内容自称 0.1.4 的包，而那种东西没有任何判据拦得住
# —— 装上去的人看到的版本号是对的，下载页上的名字是错的。
#
# ## release notes 从哪来
#
# 先找 `.github/release-notes/<tag>.md`（一个 tag 一份，人写的）。**没有就用
# `--generate-notes` 兜底，并且 `::warning::` 点名** —— 自动生成的 notes 与 0.1.4 那份
# 手写的正文不是一个量级，静默降级会让"这一版为什么发"这件事悄悄丢掉。
# `.github/**` 不在 `loment_release.GLOBS` 里，所以往这里加文件不会让发布清单过期。
#
# ## 边界
#
# * **不新增 `tools/*.py`**（`GLOBS` 是显式清单），逻辑全在这个文件里。
# * **不碰 `lom/`、不改判据**。
# * `dry_run` 在**合并之后**才有用：`workflow_dispatch` 要点得到，前提是这份文件已经在
#   默认分支上。它的用处是"先看一眼产物再决定打不打 tag"。

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（如 v0.1.5）。**必填** —— 留空只能用在该 tag 的 push 上'
        required: false
        default: ''
      dry_run:
        description: '只构建、产物挂成 workflow artifact，不碰 GitHub Release'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  dist:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 先钉 tag，再动手构建 —— 版本对不上时让它在第一步就红，不要先烧几分钟再报。
      - name: tag 与仓里的版本号必须一致
        id: ver
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -eu
          case "$TAG" in
            v*) ;;
            *) echo "::error::workflow_dispatch 要点在 tag 上，或显式给 tag —— 现在拿到的是 '$TAG'"; exit 1 ;;
          esac
          want=$(python -c "import sys;sys.path.insert(0,'tools');import loment_release;print(loment_release.RELEASE)")
          got=${TAG#v}
          printf 'tag=%s\nver=%s\n' "$TAG" "$want" >> "$GITHUB_OUTPUT"
          if [ "$got" != "$want" ]; then
            echo "::error::tag $TAG 与 tools/loment_release.py 的 RELEASE=$want 不一致 —— 不发布"
            exit 1
          fi
          echo "tag $TAG / 版本 $want 一致"

      - name: 构建发行包
        run: |
          set -e
          python tools/loment_dist.py --emit
          # 自己出的包自己校一遍（`--check` 是拿 SHA256SUMS 对产物目录，
          # 与安装脚本第一步做的是同一件事）。
          python tools/loment_dist.py --check

      - name: 产物与校验和
        run: |
          set -e
          ls -l loment/dist/
          cat loment/dist/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: loment-dist-${{ steps.ver.outputs.ver }}
          path: loment/dist/*
          if-no-files-found: error

      - name: 建 Release 并挂产物
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          VER: ${{ steps.ver.outputs.ver }}
        run: |
          set -euo pipefail
          # `-pre` 这种带 `-` 的 tag 出成 Pre-release（v0.1.4-pre 就是这么发的）。
          risk=""
          case "$TAG" in *-*) risk="--prerelease" ;; esac
          notes=".github/release-notes/$TAG.md"
          if [ -f "$notes" ]; then
            echo "notes: $notes"
            set -- --notes-file "$notes"
          else
            echo "::warning::$notes 不在 —— 这次用 --generate-notes 兜底，正文会比手写的那份薄"
            set -- --generate-notes
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在 —— 只覆盖 asset"
            gh release upload "$TAG" loment/dist/* --clobber
          else
            gh release create "$TAG" --title "Loment $VER" $risk "$@" loment/dist/*
          fi

      # 发布之后**回头核对**：文件到底上去没有。`gh release create` 不报错不等于
      # 五个 asset 都在（0.1.4 那份是手工核过的，这里把那次核对固定下来）。
      - name: 核对挂上去的 asset
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          VER: ${{ steps.ver.outputs.ver }}
        run: |
          set -eu
          have=$(gh release view "$TAG" --json assets --jq '.assets[].name' | sort)
          want=$(printf '%s\n' \
            "SHA256SUMS" \
            "loment-$VER-linux-x64.tar.gz" \
            "loment-$VER-windows-x64-setup.exe" \
            "loment-$VER-windows-x64.zip" \
            "loment-skill.zip" | sort)
          if [ "$have" != "$want" ]; then
            echo "::error::Release $TAG 的 asset 与预期不符"
            echo "--- 实有 ---"; echo "$have"
            echo "--- 应有 ---"; echo "$want"
            exit 1
          fi
          echo "$have"
          echo "五个 asset 齐了"
