# CI 工具链镜像 —— 门禁各 job 用 `container:` 拉它（见 `.github/ci/Dockerfile` 的头注释）
#
# **它只为一件东西存在**：把"装工具链"那 95s 从**每次跑**挪到**镜像构建**（只在
# Dockerfile 改动时）。所以这个 workflow 不进 PR 的门 —— 它是**供给**，不是判据。
#
# ## 为什么用裸 `docker` 而不是那几个 docker/* action
#
# 它们是**第三方** action。本仓别处只用 `actions/*` 与 `gh`，而这一件事（登录、构建、
# 推送）三条命令就写完了 —— 少一个供应链依赖是划算的。代价是要自己管 `GITHUB_TOKEN`
# 的传法：走 stdin（`--password-stdin`），**不落在命令行上**（那会让它出现在日志里）。
#
# ## 两处必须一致
#
# 镜像的 tag 在两处写着：这里的 `TAG` 与 `gate.yml` 各 job 的 `container.image`。
# **改镜像要同时抬那里的 tag**（抬 tag 是让各 job 用上新镜像的唯一动作）。
# 另外每次构建还盖一枚 `:<sha>` —— 出问题时能追到是哪一版镜像在跑。
#
# ## 可见性（这一条不做，fork 的 PR 会全红）
#
# 包默认是**私有**的，而**外部贡献者从 fork 提的 PR 拿不到私有包** ⇒ 它们的门禁会在
# "拉镜像"这一步就死。所以第一次推上去之后要把包改成 **public**：
#   https://github.com/users/<owner>/packages/container/loment-ci/settings
# 公开包不需要凭据就能拉，本仓自己的 PR 与 fork 的 PR 于是走同一条路。

name: ci-image

on:
  push:
    branches: [main]
    paths:
      - ".github/ci/Dockerfile"
      - ".github/workflows/ci-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  #: 与 `gate.yml` 各 job 的 `container.image` 里那个 tag **必须一样**
  TAG: "4"

jobs:
  build:
    name: 构建并推送 CI 工具链镜像
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 登录 ghcr
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # **ghcr 的仓库名必须全小写**（Docker 的硬要求），而 `github.repository_owner`
      # 是本仓的大小写原样 —— `FujoJTOP`。第一次就是这么红的（`repository name must be
      # lowercase`）。同时它就是 `gate.yml` 里那个字符串，两边必须一样（见文件头）。
      - name: 算镜像名（全小写）
        run: |
          owner=$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/$owner/loment-ci" >> "$GITHUB_ENV"

      - name: 构建
        run: |
          docker build -t "$IMAGE:$TAG" -t "$IMAGE:${{ github.sha }}" .github/ci

      - name: 推送
        run: |
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:${{ github.sha }}"

      - name: 记一笔
        run: |
          {
            echo "## CI 工具链镜像"
            echo ""
            echo '```'
            echo "$IMAGE:$TAG"
            echo "$IMAGE:${{ github.sha }}"
            echo '```'
            echo ""
            echo "改镜像要**同时**抬 \`gate.yml\` 各 job 里那个 tag（两处一致，见文件头）。"
          } >> "$GITHUB_STEP_SUMMARY"
